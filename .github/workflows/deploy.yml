name: Deploy to Firebase

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build Cloud Functions
        run: npm ci --prefix functions && npm run build --prefix functions

      - name: Write Firebase service account
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy hosting + Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx --yes firebase-tools@14 deploy --only hosting,firestore:rules --project travel-planner-2734f --non-interactive

      # Separate step so the site still ships if Storage hasn't been set up in the console yet.
      - name: Deploy Storage rules + CORS
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          npx --yes firebase-tools@14 deploy --only storage --project travel-planner-2734f --non-interactive
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-sa.json" --quiet
          gcloud storage buckets update gs://travel-planner-2734f.firebasestorage.app --cors-file=storage.cors.json --project travel-planner-2734f --quiet

      # Claude itinerary function. Separate step so a Functions problem doesn't block the site.
      # The Anthropic API key comes from the ANTHROPIC_API_KEY GitHub secret and is copied into
      # Google Secret Manager (needs the "Secret Manager Admin" role on the service account).
      # --force sets up the Artifact Registry cleanup policy non-interactively.
      - name: Deploy Cloud Functions
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set; skipping the Claude function."
            exit 0
          fi
          P=travel-planner-2734f
          # Run a setup command; on failure report it as an annotation (readable without the log).
          step() { local out; out=$("$@" 2>&1) || { echo "::error title=Functions setup failed::$* :: $(printf '%s' "$out" | tail -n 6 | tr '\n' ' ')"; exit 1; }; }
          step gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-sa.json" --quiet
          step gcloud services enable cloudbilling.googleapis.com secretmanager.googleapis.com --project $P --quiet
          if ! gcloud secrets describe ANTHROPIC_API_KEY --project $P >/dev/null 2>&1; then
            step gcloud secrets create ANTHROPIC_API_KEY --replication-policy=automatic --project $P --quiet
          fi
          # Add a version only when the key changed, so redeploys don't pile up versions.
          if [ "$(gcloud secrets versions access latest --secret=ANTHROPIC_API_KEY --project $P 2>/dev/null)" != "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" > "$RUNNER_TEMP/anthropic-key"
            step gcloud secrets versions add ANTHROPIC_API_KEY --data-file="$RUNNER_TEMP/anthropic-key" --project $P --quiet
            rm -f "$RUNNER_TEMP/anthropic-key"
          fi
          deploy() { npx --yes firebase-tools@14 deploy --only functions --project $P --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/functions-deploy.log"; return "${PIPESTATUS[0]}"; }
          # Newly enabled APIs can take a minute to propagate, so retry once.
          if ! deploy && ! { sleep 90; deploy; }; then
            # Surface the tail of the output as an annotation (readable without opening the log).
            msg=$(sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/functions-deploy.log" | grep -v '^\s*$' | tail -n 25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Functions deploy failed::$msg"
            exit 1
          fi
