name: Deploy to Firebase

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build Cloud Functions
        run: npm ci --prefix functions && npm run build --prefix functions

      - name: Write Firebase service account
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/firebase-sa.json"

      - name: Deploy hosting + Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx --yes firebase-tools@14 deploy --only hosting,firestore:rules --project travel-planner-2734f --non-interactive

      # Separate step so the site still ships if Storage hasn't been set up in the console yet.
      - name: Deploy Storage rules + CORS
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          npx --yes firebase-tools@14 deploy --only storage --project travel-planner-2734f --non-interactive
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-sa.json" --quiet
          gcloud storage buckets update gs://travel-planner-2734f.firebasestorage.app --cors-file=storage.cors.json --project travel-planner-2734f --quiet

      # Claude itinerary function. Separate step so a Functions problem doesn't block the site.
      # The Anthropic API key comes from the ANTHROPIC_API_KEY GitHub secret and is copied into
      # Google Secret Manager (needs the "Secret Manager Admin" role on the service account).
      # --force sets up the Artifact Registry cleanup policy non-interactively.
      - name: Deploy Cloud Functions
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set; skipping the Claude function."
            exit 0
          fi
          P=travel-planner-2734f
          # Run a setup command; on failure report it as an annotation (readable without the log).
          step() { local out; out=$("$@" 2>&1) || { echo "::error title=Functions setup failed::$* :: $(printf '%s' "$out" | tail -n 6 | tr '\n' ' ')"; exit 1; }; }
          step gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-sa.json" --quiet
          step gcloud services enable cloudbilling.googleapis.com secretmanager.googleapis.com --project $P --quiet
          if ! gcloud secrets describe ANTHROPIC_API_KEY --project $P >/dev/null 2>&1; then
            step gcloud secrets create ANTHROPIC_API_KEY --replication-policy=automatic --project $P --quiet
          fi
          # Add a version when there is no enabled one or the key changed (so redeploys don't pile up versions).
          enabled=$(gcloud secrets versions list ANTHROPIC_API_KEY --filter='state:ENABLED' --format='value(name)' --project $P 2>&1 | head -n 1)
          current=$(gcloud secrets versions access latest --secret=ANTHROPIC_API_KEY --project $P 2>/dev/null || true)
          if [ -z "$enabled" ] || [ "$current" != "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" > "$RUNNER_TEMP/anthropic-key"
            step gcloud secrets versions add ANTHROPIC_API_KEY --data-file="$RUNNER_TEMP/anthropic-key" --project $P --quiet
            rm -f "$RUNNER_TEMP/anthropic-key"
          fi
          # Version states only (never the value), visible as an annotation.
          echo "::notice title=ANTHROPIC_API_KEY versions::$(gcloud secrets versions list ANTHROPIC_API_KEY --format='value(name,state)' --project $P 2>&1 | head -n 5 | tr '\n' ' ') | key length ${#ANTHROPIC_API_KEY}"
          deploy() { npx --yes firebase-tools@14 deploy --only functions --project $P --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/functions-deploy.log"; return "${PIPESTATUS[0]}"; }
          # Newly enabled APIs can take a minute to propagate, so retry once.
          if ! deploy && ! { sleep 90; deploy; }; then
            # Surface the key output lines as annotations (one per line; readable without the log).
            sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' -e 's/\r/\n/g' "$RUNNER_TEMP/functions-deploy.log" \
              | grep -iE 'error|fail|denied|permission|missing|invalid|secret' | grep -v '^\s*$' | tail -n 8 \
              | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          fi

      # Is the function actually callable from the web app, and what did it fail on lately?
      # A Cloud Run service that lost its public invoker answers 403 before our code runs, which the
      # browser reports only as a CORS / "internal" error.
      - name: Check Cloud Function
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -z "$ANTHROPIC_API_KEY" ] && exit 0
          P=travel-planner-2734f
          U=https://asia-east1-$P.cloudfunctions.net/claudeItinerary
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-sa.json" --quiet >/dev/null 2>&1 || true
          probe() { curl -s -o "$RUNNER_TEMP/probe.txt" -w '%{http_code}' -X POST "$U" -H 'Content-Type: application/json' -d '{"data":{"kind":"spare"}}' --max-time 60; }
          code=$(probe)
          if [ "$code" = "401" ] && grep -q 'sign in first' "$RUNNER_TEMP/probe.txt"; then
            echo "::notice title=Claude function::reachable (unauthenticated call answered by the function: HTTP 401)"
          else
            echo "::warning title=Claude function::HTTP $code before reaching the function: $(head -c 200 "$RUNNER_TEMP/probe.txt" | tr '\n' ' ')"
            # Restore public invocation (the function still checks the Firebase sign-in itself).
            if out=$(gcloud run services add-iam-policy-binding claudeitinerary --region=asia-east1 --member=allUsers --role=roles/run.invoker --project $P --quiet 2>&1); then
              sleep 20
              echo "::notice title=Claude function::public invoker re-applied; now HTTP $(probe)"
            else
              echo "::error title=Claude function is not publicly callable::Cloud Run → claudeitinerary → 安全性 → 允許未經驗證的叫用 (could not fix automatically: $(printf '%s' "$out" | tail -n 2 | tr '\n' ' ' | cut -c1-300))"
            fi
          fi
          # Recent calls (status, latency) and warnings/errors from the function, newest first.
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="claudeitinerary" AND (severity>=WARNING OR jsonPayload.message="claude" OR httpRequest.requestMethod="POST")' \
            --project $P --freshness=3d --limit=12 \
            --format='value(timestamp,severity,httpRequest.status,httpRequest.latency,jsonPayload.message,jsonPayload.kind,jsonPayload.stop,jsonPayload.error,textPayload)' 2>&1 \
            | cut -c1-600 | while IFS= read -r line; do [ -n "$line" ] && echo "::notice title=Claude function log::$line"; done || true
